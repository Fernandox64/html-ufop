server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (e.g. "/sobre/" instead of "http://host:80/sobre/")
    # so the trailing-slash redirect for directories works behind any mapped
    # external port (docker -p 8080:80, a reverse proxy, etc).
    absolute_redirect off;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|woff2?|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
